name: Export files

on:
  [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: amrit3701/freecad-cli:latest
    # vars:
    #   TOOTH_COUNT: 36, 10
    #   MISSING_COUNT: { 1 }
    strategy:
      matrix:
        tooth: [36, 10, 60]
        missing: [1,2]
      skip:
        - tooth: 36
          missing: 2
        - tooth: 10
          missing: 2
        - tooth: 60
          missing: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: install nodejs
        run: |
          apt update
          apt install curl -y
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
      # - name: install freecad
      #   run: |
      #     sudo add-apt-repository ppa:freecad-maintainers/freecad-stable -y
      #     sudo apt-get update
      #     sudo apt-get install freecad -y
    
      - name: Run FreeCAD
        run: |
            mkdir /tmp/mirte-frame
            cp -r ./ /tmp/mirte-frame
            cp -r ./scripts /tmp/mirte-frame
            echo "${{
              matrix.tooth
            }}" > /tmp/mirte-frame/TOOTH_COUNT.txt
            echo "${{
              matrix.missing
            }}" > /tmp/mirte-frame/MISSING_COUNT.txt
            cd /tmp/mirte-frame/scripts
            echo "exec(open(\"/tmp/mirte-frame/scripts/generate.py\").read())" | FreeCADCmd
      - name: Upload DXF
        uses: actions/upload-artifact@v4
        with:
          name: dxfs_${{ matrix.tooth }}_missing_${{ matrix.missing }}
          path: /tmp/build/dxf/*
      - name: Upload STL
        uses: actions/upload-artifact@v4
        with:
          name: stls_${{ matrix.tooth }}_missing_${{ matrix.missing }}
          path: /tmp/build/stl/*
      - name: Upload STEP
        uses: actions/upload-artifact@v4
        with:
          name: steps_${{ matrix.tooth }}_missing_${{ matrix.missing }}
          path: /tmp/build/step/*
      - name: zip files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd /tmp/build
          zip -r /tmp/mirte-frame-stl.zip ./stl/*
          zip -r /tmp/mirte-frame-dxf.zip ./dxf/*
          zip -r /tmp/mirte-frame-step.zip ./step/*
      - name: Push to release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
            files: |
              /tmp/mirte-frame-dxf.zip
              /tmp/mirte-frame-stl.zip
              /tmp/mirte-frame-step.zip
