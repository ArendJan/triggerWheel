name: Export files

on:
  [push]

jobs:
  build:
    strategy:
      matrix:
        tooth: [
          36,
          10,
          60
        ]
        missing: [1,2]
        exclude:
          - tooth: 36
            missing: 2
          - tooth: 10
            missing: 2
          - tooth: 60
            missing: 1
    
    uses: ./.github/workflows/dxf_wf.yml
    with:
      tooth: ${{ matrix.tooth }}
      missing: ${{ matrix.missing }}
      tooth_length: 10
      tooth_duty_cycle: 50
      tooth_radius: 5
      diameter: 100
      thickness: 5
      hole_diameter: 20
      slit_width: 2
      slit_depth: 5
      slit_count: 10
      slit_offset: 0